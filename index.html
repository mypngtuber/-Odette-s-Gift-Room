<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="A magical winter fairytale birthday room for Elza, inspired by Odette and Swan Lake ballet." />
  <title>A Fairytale Birthday for Elza 🦢</title>
  
  <link rel="icon" type="image/svg+xml" href="/-Odette-s-Gift-Room/favicon.svg" />

  <!-- Google Fonts: Cormorant Garamond, Montserrat & Pinyon Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet" />

  <script type="module" crossorigin src="/-Odette-s-Gift-Room/assets/index-CCwzzdBX.js"></script>
  <link rel="stylesheet" crossorigin href="/-Odette-s-Gift-Room/assets/index-Cmosnlfk.css">
</head>
<body>
  <!-- Canvas Snowfall & Shimmering Stars -->
  <canvas id="snowfall-canvas" aria-hidden="true"></canvas>

  <!-- Atmospheric Glow Accents -->
  <div class="ambient-glow-circle glow-top-left" aria-hidden="true"></div>
  <div class="ambient-glow-circle glow-top-right" aria-hidden="true"></div>
  <div class="ambient-glow-circle glow-bottom-center" aria-hidden="true"></div>

  <div id="app">
    <!-- Top Site Navigation Header -->
    <header class="site-header" role="banner">
      <a href="#" class="header-brand" id="brand-link" aria-label="Odette's Birthday Room Home">
        <span class="brand-swan-icon" aria-hidden="true">🦢</span>
        <div class="brand-text">
          <span class="brand-title">Odette’s Gift Room</span>
          <span class="brand-subtitle">For Elza’s Birthday</span>
        </div>
      </a>

      <div class="header-controls">
        <!-- Ambient Music Toggle (Starts ONLY after user clicks) -->
        <button id="btn-music-toggle" class="header-btn" type="button" aria-label="Play fairytale music box" aria-pressed="false">
          <span class="music-icon" aria-hidden="true">🎵</span>
          <div class="audio-waves" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <span id="music-btn-text">Music: Off</span>
        </button>

        <!-- View All Gifts Button (Available inside the gift room) -->
        <button id="btn-header-view-all" class="header-btn" type="button" style="display: none;" aria-label="Open all gifts collection">
          <span aria-hidden="true">🎁</span>
          <span>View All Gifts</span>
        </button>
      </div>
    </header>

    <!-- Main Content Container (Dynamic Views) -->
    <main id="main-content" role="main">
      <!-- Views will be mounted here: Opening Screen, Gift Room, Final Screen -->
    </main>
  </div>

</body>
</html>
